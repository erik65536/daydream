# The main story, written with its quests in one answer (an outline alone stopped partway along the map). The cast
# fills the engine's slots, so every giver and person is one of them; each arc keeps to its stretch of the map; a
# fight is against one of the world's creature families, in a place it lives, and a boss is written whole (how it
# looks, sounds, and fights).
purpose: world.design
maxTokens: 24000
system: '{{> system}}'
user: |
  THE OWNER'S THEME:
  {{input.theme}}

  THE WORLD:
  {{concept.title}} ({{concept.genre}})
  {{concept.setting}}
  Tone: {{concept.tone}}

  {{#input.prompts[topic=story|people|monsters].length}}
  THE OWNER'S PROMPTS:
  {{#input.prompts[topic=story|people|monsters]}}
  - about {{about}}: {{text}}
  {{/input.prompts[topic=story|people|monsters]}}
  {{/input.prompts[topic=story|people|monsters].length}}

  THE PLACES, in the order they are reached, from first to last:
  {{#map.places}}
  - {{placePlan.name}} ({{label}}{{#off}}, off {{placePlan.name}}{{/off}}): {{placePlan.description}}
  {{/map.places}}

  THE CREATURES AND FOES:
  {{#map.families}}
  - {{creatures.name}}, living in {{#creatures.lives}}{{.}}{{^$last}}, {{/$last}}{{/creatures.lives}}: {{creatures.description}}
  {{/map.families}}

  {{constants.questSense}} A boss is the one foe an arc comes to a head with: at most one in each arc, and none in an arc that is resolved without a fight.

  Write the main story of this world.
# A boss or a named foe is met under its own name, so no two share one.
names:
  - 'story.arcs[*].quests[*].steps[*].name'
  - 'story.arcs[*].quests[*].steps[*].fight[*].name'
schema:
  type: object
  properties:
    cast:
      keys: { from: 'map.cast[*].id' }
      each:
        type: object
        description: A person of the story who lives in {{$.town.placePlan.name}}. Everyone in the cast is a different person.
        properties:
          name: { type: string, maxLength: 60 }
          who: { type: string, maxLength: 240, description: Who they are and their part in the story }
    arcs:
      keys: { from: 'map.arcs[*].id' }
      description: The whole story, from its beginning to its end, arc by arc
      each:
        type: object
        description: Told across {{#$.stretch}}{{placePlan.name}}{{^$last}}, {{/$last}}{{/$.stretch}}
        properties:
          title: { type: string, maxLength: 80 }
          quests:
            type: array
            minItems: 1
            maxItems: 4
            items:
              type: object
              properties:
                title: { type: string, maxLength: 80 }
                giver: { enum: { from: '$.cast[*].id' }, description: The person who asks }
                steps:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items:
                    anyOf:
                      - &persuade
                        type: object
                        properties:
                          kind: { const: persuade }
                          person: { enum: { from: '$.cast[*].id' } }
                          to: { type: string, maxLength: 120, description: 'What they come to agree to, as words that follow "Persuade them to"' }
                      - &bring
                        type: object
                        properties:
                          kind: { const: bring }
                          item: { type: string, maxLength: 80, description: 'As it is said in a sentence: "Find ___"' }
                          from: { enum: { from: '$.reach[*].placePlan.name' }, description: Where it is found }
                          to: { enum: { from: '$.cast[*].id' }, nullable: true, description: 'Who it is taken to, or no one when it is kept' }
                      - &fight
                        type: object
                        properties:
                          kind: { const: fight }
                          where: { enum: { from: '$.reach[kind=wilderness|dungeon].placePlan.name' } }
                          foes: { enum: { from: 'map.families[*].creatures.name' }, description: The family fought there }
                      - &foe
                        type: object
                        properties:
                          kind: { const: foe }
                          name: { type: string, maxLength: 60, description: 'Its own name' }
                          who: { type: string, maxLength: 200 }
                          member: { enum: { from: 'map.families[*].creatures.members[*].name' }, description: The kind of creature it is }
                          where: { enum: { from: '$.reach[kind=wilderness|dungeon].placePlan.name' } }
                          taunt: { type: string, maxLength: 160, description: What it says as the fight begins }
                          voice: { type: string, maxLength: 240, description: '{{constants.voice}}' }
                      - type: object
                        description: 'A choice: fight, or a clever way to get the same done without fighting'
                        properties:
                          kind: { const: either }
                          fight:
                            type: array
                            minItems: 1
                            maxItems: 2
                            description: 'The way that fights: the fight, and what it wins when the clever way does without that'
                            items:
                              anyOf:
                                - *fight
                                - *foe
                                - *bring
                          otherwise: *persuade
                      - type: object
                        properties:
                          kind: { const: boss }
                          name: { type: string, maxLength: 60 }
                          who: { type: string, maxLength: 240 }
                          where: { enum: { from: '$.reach[kind=wilderness|dungeon].placePlan.name' } }
                          classes:
                            type: array
                            minItems: 1
                            maxItems: 2
                            description: 'The classes it fights as, using their skills: one, or two it mixes'
                            items:
                              anyOf:
                                - { const: physical_melee, when: rulesCore.classes.physical.melee, description: '{{rulesCore.classes.physical.melee.name}}' }
                                - { const: physical_ranged, when: rulesCore.classes.physical.ranged, description: '{{rulesCore.classes.physical.ranged.name}}' }
                                - { const: magic_melee, when: rulesCore.classes.magical.melee, description: '{{rulesCore.classes.magical.melee.name}}' }
                                - { const: magic_ranged, when: rulesCore.classes.magical.ranged, description: '{{rulesCore.classes.magical.ranged.name}}' }
                                - { const: healer, when: rulesCore.classes.healer, description: '{{rulesCore.classes.healer.name}}' }
                                - { const: buff_and_debuff, when: rulesCore.classes.buff_and_debuff, description: '{{rulesCore.classes.buff_and_debuff.name}}' }
                          looks: { type: string, maxLength: 300, description: 'What it looks like, used to draw it' }
                          taunt: { type: string, maxLength: 200, description: What it says as the fight begins }
                          voice: { type: string, maxLength: 240, description: '{{constants.voice}}' }
                background: { type: string, maxLength: 300, description: 'What is wrong, and the steps above as they would ask them of someone who just arrived: the same people, places, and things' }
